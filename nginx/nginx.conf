user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 🌍 Docker DNS resolver
    resolver 127.0.0.11 valid=30s;


    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 🔁 HTTP → HTTPS redirect
    server {
        listen 80;
        server_name taxflow.helloyashparmar.dev www.taxflow.helloyashparmar.dev;

        location / {
            return 301 https://$host$request_uri;
        }

        # Health check for Nginx (internal)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }

    # 🔒 HTTPS server
    server {
        listen 443 ssl;
        server_name taxflow.helloyashparmar.dev www.taxflow.helloyashparmar.dev;

        ssl_certificate /etc/letsencrypt/live/taxflow.helloyashparmar.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/taxflow.helloyashparmar.dev/privkey.pem;

        # 🔐 SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            set $api_upstream http://api:4000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
