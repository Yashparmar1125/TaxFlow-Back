name: Backend CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./backend

      - name: Run Build
        run: npm run build
        working-directory: ./backend

      - name: Run Tests
        run: npm run test
        working-directory: ./backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret' }}
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/backend

            # Synchronize with the latest code (using main as the active branch)
            git fetch origin main
            git reset --hard origin/main

            # Build and scale to 3 instances for high availability
            docker compose up -d --build --scale api=3

            # Gracefully reload Nginx to load balance across new instances
            docker compose exec -T nginx nginx -s reload

            # Verify the API is running correctly
            docker ps
            docker compose logs api --tail=50

            # Prune old images and builders to keep server clean
            docker system prune -af --volumes
