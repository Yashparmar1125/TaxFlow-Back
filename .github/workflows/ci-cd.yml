name: Backend CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validate:
    name: Test & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: complianceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Build
        run: npm run build

      - name: Run Tests
        run: npm run test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret' }}
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/complianceos_test"

  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
      - name: Execute High-Availability Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/backend

            echo "[INFO] Syncing source code with master"
            git fetch origin master
            git reset --hard origin/master

            echo "[INFO] Scaling API instances for High-Availability"
            docker compose up -d --build --scale api=3

            echo "[INFO] Gracefully reloading Nginx balancer"
            docker compose exec -T nginx nginx -s reload

            echo "[INFO] Performing post-deployment health verification"
            # Wait for instances to stabilize
            sleep 10
            docker ps
            
            echo "[INFO] Pruning legacy images and builders"
            docker system prune -af --volumes

            echo "[SUCCESS] HA Deployment finalized"
