name: Backend CI/CD

on:
  push:
    branches: [ "master", "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/taxflow/backend

            # Synchronize with the latest code
            git fetch origin master
            git reset --hard origin/master

            # Build and scale to 3 instances for high availability
            docker compose up -d --build --scale api=3

            # Gracefully reload Nginx to load balance across new instances
            docker compose exec -T nginx nginx -s reload

            # Verify the API is running correctly
            docker compose logs api --tail=20

            # Prune old images and builders to keep server clean
            docker system prune -af --volumes
